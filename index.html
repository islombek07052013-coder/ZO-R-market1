<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZO'R market - Oziq-ovqat mahsulotlari</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#F6F5F2] text-slate-800 flex justify-center items-center min-h-screen">

    <!-- App Wrapper (Uzum Market Light Style) -->
    <div class="w-full max-w-md bg-white min-h-screen shadow-2xl relative flex flex-col overflow-hidden md:my-6 md:rounded-3xl border border-slate-200/80">
        
        <!-- Header -->
        <header class="bg-white/90 backdrop-blur-md sticky top-0 z-40 px-4 py-3 flex items-center justify-between border-b border-slate-100 shadow-sm">
            <div class="flex items-center space-x-2">
                <span class="text-2xl font-black text-emerald-600 tracking-tight">ZO'R <span class="text-slate-900">market</span></span>
            </div>

            <div class="flex items-center space-x-2.5">
                <!-- Language Switcher -->
                <select id="langSelect" class="bg-slate-100 border border-slate-200 text-slate-700 rounded-xl px-2 py-1 text-xs font-semibold focus:outline-none">
                    <option value="uz">UZ</option>
                    <option value="ru">RU</option>
                    <option value="en">EN</option>
                </select>

                <!-- Cart Button -->
                <button onclick="toggleCart()" class="relative bg-emerald-50 text-emerald-600 p-2 rounded-xl hover:bg-emerald-100 transition border border-emerald-100">
                    <i class="fa-solid fa-cart-shopping text-base"></i>
                    <span id="cartBadge" class="absolute -top-1 -right-1 bg-emerald-600 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
                </button>

                <!-- Admin Link -->
                <a href="admin.html" class="bg-slate-900 text-white px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-emerald-600 transition flex items-center shadow-sm">
                    <i class="fa-solid fa-user-shield mr-1"></i> Admin
                </a>
            </div>
        </header>

        <!-- Main Scroll Area -->
        <main class="flex-1 overflow-y-auto p-4 space-y-5 pb-24">
            
            <!-- Banner -->
            <div class="relative bg-gradient-to-r from-emerald-500 to-teal-600 rounded-2xl p-4 text-white shadow-md overflow-hidden">
                <div class="max-w-[210px]">
                    <span class="bg-white/20 text-white text-[10px] font-bold px-2 py-0.5 rounded-full uppercase">⚡ Uzum tezkor yetkazish</span>
                    <h1 class="text-lg font-bold mt-1.5 leading-snug" id="bannerTitle">Sifatli va hamyonbop oziq-ovqatlar</h1>
                    <p class="text-xs text-emerald-100 mt-1">Uyingizgacha 30 daqiqada yetkazamiz!</p>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="relative">
                <input type="text" id="searchInput" placeholder="Mahsulotlarni qidirish..." class="w-full bg-[#F6F5F2] border border-slate-200 rounded-xl py-2.5 pl-10 pr-4 text-xs focus:outline-none focus:border-emerald-500 transition">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-xs"></i>
            </div>

            <!-- Categories -->
            <div class="flex space-x-2 overflow-x-auto pb-1 scrollbar-none" id="categoriesContainer">
                <button onclick="filterCategory('all')" class="cat-btn bg-emerald-600 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap shadow-sm">Barchasi</button>
                <button onclick="filterCategory('fruits')" class="cat-btn bg-[#F6F5F2] text-slate-700 border border-slate-200 px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap hover:bg-slate-200">🍓 Mevalar</button>
                <button onclick="filterCategory('dairy')" class="cat-btn bg-[#F6F5F2] text-slate-700 border border-slate-200 px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap hover:bg-slate-200">🥛 Sut va tuxum</button>
                <button onclick="filterCategory('bakery')" class="cat-btn bg-[#F6F5F2] text-slate-700 border border-slate-200 px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap hover:bg-slate-200">🥐 Non va pishiriq</button>
                <button onclick="filterCategory('sweets')" class="cat-btn bg-[#F6F5F2] text-slate-700 border border-slate-200 px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap hover:bg-slate-200">🍫 Shirinliklar</button>
                <button onclick="filterCategory('beverages')" class="cat-btn bg-[#F6F5F2] text-slate-700 border border-slate-200 px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap hover:bg-slate-200">🧃 Ichimliklar</button>
            </div>

            <!-- Products Title -->
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-sm text-slate-800" id="popularTitle">Ommabop mahsulotlar</h2>
                <span class="text-xs text-emerald-600 font-semibold cursor-pointer">Hammasi →</span>
            </div>

            <!-- Products Grid -->
            <div id="productsGrid" class="grid grid-cols-2 gap-3">
                <!-- JS orqali chiqariladi -->
            </div>
        </main>

        <!-- Uzum Style Cart Drawer -->
        <div id="cartDrawer" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex justify-end">
            <div class="w-full max-w-sm bg-white h-full shadow-2xl flex flex-col transform translate-x-full transition-transform duration-300" id="cartPanel">
                <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-[#F6F5F2]">
                    <h2 class="font-bold text-sm text-slate-800" id="cartTitle">Savatcha</h2>
                    <button onclick="toggleCart()" class="text-slate-400 hover:text-slate-700 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-3">
                    <!-- Savat ichi -->
                </div>
                <div class="p-4 border-t border-slate-100 bg-[#F6F5F2] space-y-3">
                    <div class="flex justify-between font-bold text-sm">
                        <span id="totalLabel" class="text-slate-600">Jami summasi:</span>
                        <span id="cartTotal" class="text-emerald-600 font-extrabold text-base">0 so'm</span>
                    </div>
                    <div class="space-y-2">
                        <input type="text" id="orderPhone" placeholder="Telefon raqamingiz (+998...)" class="w-full bg-white border border-slate-200 rounded-xl p-2.5 text-xs focus:outline-none focus:border-emerald-500">
                        <input type="text" id="orderAddress" placeholder="Yetkazib berish manzili" class="w-full bg-white border border-slate-200 rounded-xl p-2.5 text-xs focus:outline-none focus:border-emerald-500">
                        <button onclick="checkoutOrder()" class="w-full bg-emerald-600 text-white py-3 rounded-xl text-xs font-bold hover:bg-emerald-700 transition shadow-md shadow-emerald-600/20" id="checkoutBtn">Buyurtmani rasmiylashtirish</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Product Modal -->
        <div id="productModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
            <div class="bg-white rounded-3xl p-5 w-full max-w-xs shadow-2xl relative">
                <button onclick="closeProductModal()" class="absolute right-3 top-3 text-slate-400 hover:text-slate-700 bg-slate-100 w-7 h-7 rounded-full flex items-center justify-center"><i class="fa-solid fa-xmark text-xs"></i></button>
                <div id="modalContent"></div>
            </div>
        </div>

    </div>

    <script>
        const translations = {
            uz: { search: "Mahsulotlarni qidirish...", cart: "Savatcha", total: "Jami summasi:", checkout: "Buyurtmani rasmiylashtirish", popular: "Ommabop mahsulotlar", banner: "Sifatli va hamyonbop oziq-ovqatlar" },
            ru: { search: "Поиск продуктов...", cart: "Корзина", total: "Итоговая сумма:", checkout: "Оформить заказ", popular: "Популярные товары", banner: "Качественные продукты с доставкой" },
            en: { search: "Search groceries...", cart: "Cart", total: "Total Price:", checkout: "Checkout Now", popular: "Popular Products", banner: "Fresh Groceries Delivered Fast" }
        };

        let currentLang = 'uz';

        // Oziq-ovqat mahsulotlarining boyitilgan ro'yxati
        const defaultProducts = [
            { id: 1, name: "Banan (Ekvador)", price: 22000, category: "fruits", image: "https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=400", weight: "1 kg", desc: "Shirin va tabiiy sarg'ish bananlar." },
            { id: 2, name: "Qizil olma (Fuji)", price: 16000, category: "fruits", image: "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=400", weight: "1 kg", desc: "Sersuv va qarsillaydigan shirin olma." },
            { id: 3, name: "Tabiiy sut 3.2%", price: 12000, category: "dairy", image: "https://images.unsplash.com/photo-1550583724-b2692b85b150?w=400", weight: "1 Litr", desc: "Pasterizatsiyalangan yangi sut." },
            { id: 4, name: "Qishloq tuxumi 10-talik", price: 17000, category: "dairy", image: "https://images.unsplash.com/photo-1516467508483-a7212febe31a?w=400", weight: "10 dona", desc: "Saralangan yangi tovuq tuxumlari." },
            { id: 5, name: "Toshkent noni (Tandir)", price: 4500, category: "bakery", image: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=400", weight: "1 dona", desc: "Issiq va mazali tandir noni." },
            { id: 6, name: "Fransuz kruassani", price: 9000, category: "bakery", image: "https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=400", weight: "80g", desc: "Sariyog'li va yumshoq kruassan." },
            { id: 7, name: "Qora shokolad Nestlé", price: 24000, category: "sweets", image: "https://images.unsplash.com/photo-1548592355-d4e5f03767cb?w=400", weight: "100g", desc: "70% achchiq sifatli shokolad." },
            { id: 8, name: "Apelsin sharbati 1L", price: 19000, category: "beverages", image: "https://images.unsplash.com/photo-1613478223719-2ab802602423?w=400", weight: "1 Litr", desc: "100% tabiiy va vitaminli sharbat." },
            { id: 9, name: "Coca-Cola Classic 1.5L", price: 13500, category: "beverages", image: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=400", weight: "1.5 Litr", desc: "Salqinlashtiruvchi gazlangan ichimlik." }
        ];

        let products = JSON.parse(localStorage.getItem('zor_products'));
        if (!products || products.length === 0) {
            products = defaultProducts;
            localStorage.setItem('zor_products', JSON.stringify(products));
        }

        let cart = [];
        let orders = JSON.parse(localStorage.getItem('zor_orders')) || [];

        window.onload = function() {
            renderProducts();
            updateUI();
            document.getElementById('langSelect').addEventListener('change', (e) => {
                currentLang = e.target.value;
                updateUI();
            });
        };

        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('searchInput').placeholder = t.search;
            document.getElementById('cartTitle').innerText = t.cart;
            document.getElementById('totalLabel').innerText = t.total;
            document.getElementById('checkoutBtn').innerText = t.checkout;
            document.getElementById('popularTitle').innerText = t.popular;
            document.getElementById('bannerTitle').innerText = t.banner;
            renderProducts();
            renderCart();
        }

        function renderProducts(filter = 'all', search = '') {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            let filtered = products.filter(p => {
                let matchCat = filter === 'all' || p.category === filter;
                let matchSearch = p.name.toLowerCase().includes(search.toLowerCase());
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-400 py-8 text-xs">Mahsulot topilmadi</p>`;
                return;
            }

            filtered.forEach(p => {
                grid.innerHTML += `
                    <div class="bg-white border border-slate-200/80 rounded-2xl p-2.5 flex flex-col justify-between shadow-sm hover:shadow-md transition">
                        <div onclick="openProductModal(${p.id})" class="cursor-pointer">
                            <img src="${p.image}" alt="${p.name}" class="w-full h-28 object-cover rounded-xl mb-2 bg-[#F6F5F2]">
                            <h3 class="font-bold text-xs text-slate-800 mb-0.5 truncate">${p.name}</h3>
                            <span class="text-[10px] text-slate-400 block mb-1 font-medium">${p.weight || '1 dona'}</span>
                        </div>
                        <div>
                            <div class="font-extrabold text-emerald-600 text-xs mb-2">${p.price.toLocaleString()} so'm</div>
                            <button onclick="addToCart(${p.id})" class="w-full bg-emerald-50 text-emerald-600 hover:bg-emerald-600 hover:text-white py-1.5 rounded-xl text-xs font-bold transition">+ Qo'shish</button>
                        </div>
                    </div>
                `;
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderProducts('all', e.target.value);
        });

        function filterCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn bg-[#F6F5F2] text-slate-700 border border-slate-200 px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap hover:bg-slate-200 transition";
            });
            event.target.className = "cat-btn active-cat bg-emerald-600 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap shadow-sm transition";
            renderProducts(cat, document.getElementById('searchInput').value);
        }

        function toggleCart() {
            const drawer = document.getElementById('cartDrawer');
            const panel = document.getElementById('cartPanel');
            if (drawer.classList.contains('pointer-events-none')) {
                drawer.classList.remove('pointer-events-none', 'opacity-0');
                panel.classList.remove('translate-x-full');
            } else {
                drawer.classList.add('pointer-events-none', 'opacity-0');
                panel.classList.add('translate-x-full');
            }
        }

        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty++;
            } else {
                cart.push({ ...prod, qty: 1 });
            }
            renderCart();
            toggleCart();
        }

        function renderCart() {
            const container = document.getElementById('cartItems');
            container.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 py-10 text-xs">Savatchangiz bo'sh</p>`;
                document.getElementById('cartTotal').innerText = `0 so'm`;
                document.getElementById('cartBadge').innerText = 0;
                return;
            }

            let badgeCount = 0;
            cart.forEach(item => {
                total += item.price * item.qty;
                badgeCount += item.qty;
                container.innerHTML += `
                    <div class="flex items-center justify-between border-b border-slate-100 pb-2.5">
                        <div class="flex items-center space-x-2">
                            <img src="${item.image}" class="w-10 h-10 object-cover rounded-lg bg-slate-100">
                            <div>
                                <h4 class="text-xs font-bold text-slate-800">${item.name}</h4>
                                <div class="text-[11px] text-emerald-600 font-bold">${item.price.toLocaleString()} so'm</div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2 bg-slate-100 rounded-lg px-2 py-1">
                            <button onclick="changeQty(${item.id}, -1)" class="text-slate-600 font-bold text-xs">-</button>
                            <span class="text-xs font-bold text-slate-800">${item.qty}</span>
                            <button onclick="changeQty(${item.id}, 1)" class="text-slate-600 font-bold text-xs">+</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('cartTotal').innerText = total.toLocaleString() + " so'm";
            document.getElementById('cartBadge').innerText = badgeCount;
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
            }
            renderCart();
        }

        function checkoutOrder() {
            const phone = document.getElementById('orderPhone').value;
            const address = document.getElementById('orderAddress').value;
            if (!phone || !address || cart.length === 0) {
                alert("Iltimos, telefon raqam va manzilni kiriting!");
                return;
            }

            const newOrder = {
                id: Date.now(),
                phone,
                address,
                items: [...cart],
                total: cart.reduce((sum, i) => sum + (i.price * i.qty), 0),
                date: new Date().toLocaleString()
            };

            orders.push(newOrder);
            localStorage.setItem('zor_orders', JSON.stringify(orders));
            alert("Buyurtmangiz Uzum Market tizimiga muvaffaqiyatli jo'natildi!");
            cart = [];
            renderCart();
            toggleCart();
        }

        function openProductModal(id) {
            const p = products.find(prod => prod.id === id);
            if (!p) return;
            
            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <img src="${p.image}" class="w-full h-36 object-cover rounded-2xl mb-3 bg-[#F6F5F2]">
                <h3 class="font-bold text-sm text-slate-800 mb-0.5">${p.name}</h3>
                <div class="text-emerald-600 font-extrabold text-xs mb-2">${p.price.toLocaleString()} so'm / ${p.weight || 'dona'}</div>
                <p class="text-xs text-slate-500 mb-4 leading-relaxed">${p.desc || "Sifatli va yangi uzilgan mahsulot."}</p>
                <button onclick="addToCart(${p.id}); closeProductModal();" class="w-full bg-emerald-600 text-white py-2.5 rounded-xl text-xs font-bold hover:bg-emerald-700 transition">Savatchaga qo'shish</button>
            `;
            document.getElementById('productModal').classList.remove('hidden');
            document.getElementById('productModal').classList.add('flex');
        }

        function closeProductModal() {
            document.getElementById('productModal').classList.add('hidden');
            document.getElementById('productModal').classList.remove('flex');
        }
    </script>
</body>
</html>
