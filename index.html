<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZO'R market - Internet-do'kon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .uzum-purple { background-color: #7000FF; }
        .uzum-purple-text { color: #7000FF; }
        .uzum-purple-hover:hover { background-color: #5d00d1; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
            <a href="#" class="text-2xl font-black uzum-purple-text tracking-tighter flex items-center">
                <span class="bg-[#7000FF] text-white p-1.5 rounded-xl mr-1.5 text-lg"><i class="fa-solid fa-bag-shopping"></i></span> ZO'R market
            </a>
            <div class="flex-1 max-w-2xl relative">
                <input type="text" id="searchInput" placeholder="Mahsulotlar izlash..." class="w-full bg-gray-100 border-2 border-transparent focus:border-[#7000FF] focus:bg-white rounded-xl py-2.5 px-4 text-sm outline-none transition">
            </div>
            <button onclick="toggleCart()" class="flex flex-col items-center text-gray-600 hover:text-[#7000FF] text-xs font-medium relative">
                <i class="fa-solid fa-cart-shopping text-lg mb-0.5"></i>
                <span>Savat</span>
                <span id="cartBadge" class="absolute -top-1 right-2 uzum-purple text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
        <div id="productsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
    </main>

    <!-- Cart Drawer -->
    <div id="cartDrawer" class="fixed inset-0 bg-black/50 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex justify-end">
        <div class="w-full max-w-md bg-white h-full shadow-2xl flex flex-col transform translate-x-full transition-transform duration-300" id="cartPanel">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <h2 class="font-bold text-lg">Savatchangiz</h2>
                <button onclick="toggleCart()" class="text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
            <div class="p-4 border-t bg-gray-50 space-y-3">
                <div class="flex justify-between font-bold">
                    <span>Jami:</span>
                    <span id="cartTotal" class="uzum-purple-text">0 so'm</span>
                </div>
                <input type="text" id="orderPhone" placeholder="Telefon raqamingiz (+998...)" class="w-full border rounded-xl p-3 text-xs">
                <input type="text" id="orderAddress" placeholder="Manzilingiz" class="w-full border rounded-xl p-3 text-xs">
                <button onclick="checkoutOrder()" class="w-full uzum-purple text-white py-3 rounded-xl text-xs font-bold">Buyurtma berish</button>
            </div>
        </div>
    </div>

    <script>
        let products = JSON.parse(localStorage.getItem('zor_products')) || [
            { id: 1, name: "Banan Ekvador", price: 22000, category: "fruits", image: "https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=400" },
            { id: 2, name: "Qizil olma Fuji", price: 16000, category: "fruits", image: "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=400" }
        ];
        let cart = [];

        window.onload = function() { renderProducts(); };

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            products.forEach(p => {
                grid.innerHTML += `
                    <div class="bg-white border rounded-2xl p-3 flex flex-col justify-between shadow-sm">
                        <img src="${p.image}" class="w-full h-36 object-cover rounded-xl mb-2">
                        <h3 class="font-medium text-xs mb-1">${p.name}</h3>
                        <div class="font-black text-sm mb-2">${Number(p.price).toLocaleString()} so'm</div>
                        <button onclick="addToCart(${p.id})" class="w-full bg-purple-50 uzum-purple-text hover:bg-[#7000FF] hover:text-white py-2 rounded-xl text-xs font-bold transition">Savatga</button>
                    </div>
                `;
            });
        }

        function toggleCart() {
            const d = document.getElementById('cartDrawer'), p = document.getElementById('cartPanel');
            d.classList.toggle('pointer-events-none'); d.classList.toggle('opacity-0');
            p.classList.toggle('translate-x-full');
        }

        function addToCart(id) {
            let p = products.find(x => x.id === id);
            let item = cart.find(x => x.id === id);
            if (item) item.qty++; else cart.push({...p, qty: 1});
            renderCart(); toggleCart();
        }

        function renderCart() {
            let container = document.getElementById('cartItems'), total = 0, count = 0;
            container.innerHTML = '';
            cart.forEach(i => {
                total += i.price * i.qty; count += i.qty;
                container.innerHTML += `<div class="flex justify-between text-xs border-b pb-2"><span>${i.name} (${i.qty}ta)</span> <b>${(i.price*i.qty).toLocaleString()} so'm</b></div>`;
            });
            document.getElementById('cartTotal').innerText = total.toLocaleString() + " so'm";
            document.getElementById('cartBadge').innerText = count;
        }

        function checkoutOrder() {
            let phone = document.getElementById('orderPhone').value, address = document.getElementById('orderAddress').value;
            if(!phone || !address || cart.length === 0) return alert("Ma'lumotlarni to'ldiring!");
            let orders = JSON.parse(localStorage.getItem('zor_orders')) || [];
            orders.push({ phone, address, items: cart, total: cart.reduce((s,i)=>s+i.price*i.qty,0), date: new Date().toLocaleString() });
            localStorage.setItem('zor_orders', JSON.stringify(orders));
            alert("Buyurtma qabul qilindi!"); cart = []; renderCart(); toggleCart();
        }
    </script>
</body>
</html>
