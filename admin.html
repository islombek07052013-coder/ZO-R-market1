<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZO'R market - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .uzum-purple { background-color: #7000FF; }
        .uzum-purple-text { color: #7000FF; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <!-- Admin Dashboard -->
    <div id="adminDashboard" class="min-h-screen flex flex-col">
        <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center border-b">
            <h1 class="text-lg font-black uzum-purple-text"><i class="fa-solid fa-gauge mr-2"></i> ZO'R market - Boshqaruv Paneli</h1>
            <div class="space-x-3">
                <a href="./index.html" class="bg-purple-100 text-purple-700 hover:bg-purple-200 px-4 py-2 rounded-xl text-xs font-bold transition inline-block">Saytga o'tish</a>
                <button onclick="adminLogout()" class="bg-red-50 text-red-600 px-4 py-2 rounded-xl text-xs font-bold">Chiqish</button>
            </div>
        </header>

        <main class="max-w-6xl mx-auto p-6 flex-1 w-full">
            <div class="flex space-x-2 mb-6 border-b pb-3">
                <button onclick="switchTab('products')" id="tabProd" class="uzum-purple text-white px-5 py-2.5 rounded-xl text-xs font-bold shadow-sm">Mahsulotlar</button>
                <button onclick="switchTab('orders')" id="tabOrd" class="bg-gray-100 text-gray-700 px-5 py-2.5 rounded-xl text-xs font-bold">Buyurtmalar</button>
            </div>

            <!-- Products Tab -->
            <div id="productsTab" class="space-y-6">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                    <h3 class="font-bold text-sm mb-3 text-gray-800" id="formTitle">Mahsulotni qo'shish yoki tahrirlash</h3>
                    <input type="hidden" id="editIndex" value="-1">
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                        <input type="text" id="pName" placeholder="Nomi (Masalan: Banan)" class="border p-2.5 rounded-xl text-xs outline-none focus:border-[#7000FF]">
                        <input type="number" id="pPrice" placeholder="Narxi (so'mda)" class="border p-2.5 rounded-xl text-xs outline-none focus:border-[#7000FF]">
                        <input type="text" id="pImg" placeholder="Rasm URL havolasi" class="border p-2.5 rounded-xl text-xs outline-none focus:border-[#7000FF]">
                        <select id="pCat" class="border p-2.5 rounded-xl text-xs outline-none focus:border-[#7000FF]">
                            <option value="fruits">Meva va sabzavot</option>
                            <option value="dairy">Sut va tuxum</option>
                            <option value="bakery">Non va pishiriq</option>
                            <option value="sweets">Shirinliklar</option>
                            <option value="meat">Go'sht va baliq</option>
                            <option value="beverages">Ichimliklar</option>
                        </select>
                    </div>
                    
                    <div class="mt-4 flex items-center space-x-2">
                        <input type="checkbox" id="pDiscount" class="w-4 h-4 accent-[#7000FF] cursor-pointer">
                        <label for="pDiscount" class="text-xs font-bold text-gray-700 cursor-pointer">🔥 Skidka ("Arzon narx") yorlig'ini yoqish</label>
                    </div>

                    <div class="mt-4 flex space-x-2">
                        <button onclick="saveProduct()" id="saveBtn" class="uzum-purple text-white px-5 py-2.5 rounded-xl text-xs font-bold hover:opacity-90 transition">Saqlash</button>
                        <button onclick="resetForm()" id="cancelBtn" class="hidden bg-gray-200 text-gray-700 px-4 py-2.5 rounded-xl text-xs font-bold">Bekor qilish</button>
                    </div>
                </div>

                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                    <h3 class="font-bold text-sm mb-3 text-gray-800">Mavjud mahsulotlar</h3>
                    <div id="productList" class="space-y-2"></div>
                </div>
            </div>

            <!-- Orders Tab -->
            <div id="ordersTab" class="hidden">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                    <h3 class="font-bold text-sm mb-3 text-gray-800">Kelib tushgan buyurtmalar</h3>
                    <div id="orderList" class="space-y-3"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('zor_current_user'));
        let products = JSON.parse(localStorage.getItem('zor_products')) || [];
        let orders = JSON.parse(localStorage.getItem('zor_orders')) || [];

        window.onload = function() {
            if (!currentUser || !currentUser.isAdmin) {
                alert("Sizda bu sahifaga kirish huquqi yo'q!");
                window.location.href = "index.html";
            } else {
                renderProducts();
                renderOrders();
            }
        }

        function adminLogout() {
            currentUser.isAdmin = false;
            localStorage.setItem('zor_current_user', JSON.stringify(currentUser));
            window.location.href = "index.html";
        }

        function switchTab(tab) {
            if (tab === 'products') {
                document.getElementById('productsTab').classList.remove('hidden');
                document.getElementById('ordersTab').classList.add('hidden');
                document.getElementById('tabProd').className = "uzum-purple text-white px-5 py-2.5 rounded-xl text-xs font-bold shadow-sm";
                document.getElementById('tabOrd').className = "bg-gray-100 text-gray-700 px-5 py-2.5 rounded-xl text-xs font-bold";
            } else {
                document.getElementById('productsTab').classList.add('hidden');
                document.getElementById('ordersTab').classList.remove('hidden');
                document.getElementById('tabOrd').className = "uzum-purple text-white px-5 py-2.5 rounded-xl text-xs font-bold shadow-sm";
                document.getElementById('tabProd').className = "bg-gray-100 text-gray-700 px-5 py-2.5 rounded-xl text-xs font-bold";
            }
        }

        function saveProduct() {
            const id = document.getElementById('editIndex').value;
            const name = document.getElementById('pName').value;
            const price = Number(document.getElementById('pPrice').value);
            const image = document.getElementById('pImg').value || "https://images.unsplash.com/photo-1542838132-92c53300491e?w=400";
            const category = document.getElementById('pCat').value;
            const hasDiscount = document.getElementById('pDiscount').checked;

            if (!name || !price) return alert("Nomi va narxini kiriting!");

            if (id === "-1") {
                products.push({ id: Date.now(), name, price, category, image, hasDiscount, weight: "1 dona", desc: "Sifatli va yangi mahsulot." });
                alert("Mahsulot qo'shildi!");
            } else {
                products[id].name = name;
                products[id].price = price;
                products[id].image = image;
                products[id].category = category;
                products[id].hasDiscount = hasDiscount;
                alert("Mahsulot muvaffaqiyatli o'zgartirildi!");
            }

            localStorage.setItem('zor_products', JSON.stringify(products));
            resetForm();
            renderProducts();
        }

        function renderProducts() {
            const list = document.getElementById('productList');
            list.innerHTML = '';
            products.forEach((p, index) => {
                let badgeStatus = p.hasDiscount ? '<span class="text-purple-600 font-bold ml-2">(🔥 Skidka yoniq)</span>' : '';
                list.innerHTML += `
                    <div class="flex items-center justify-between bg-gray-50 p-3 rounded-xl border text-xs">
                        <div class="flex items-center space-x-3">
                            <img src="${p.image}" class="w-10 h-10 object-cover rounded-lg">
                            <div>
                                <p class="font-bold text-gray-800">${p.name} ${badgeStatus}</p>
                                <p class="text-emerald-600 font-extrabold">${Number(p.price).toLocaleString()} so'm</p>
                            </div>
                        </div>
                        <div class="space-x-1">
                            <button onclick="editProduct(${index})" class="bg-blue-50 text-blue-600 px-3 py-1.5 rounded-lg font-bold hover:bg-blue-100">O'zgartirish</button>
                            <button onclick="deleteProduct(${p.id})" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg font-bold hover:bg-red-100">O'chirish</button>
                        </div>
                    </div>
                `;
            });
        }

        function editProduct(index) {
            const p = products[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('pName').value = p.name;
            document.getElementById('pPrice').value = p.price;
            document.getElementById('pImg').value = p.image;
            document.getElementById('pCat').value = p.category;
            document.getElementById('pDiscount').checked = p.hasDiscount || false;
            
            document.getElementById('formTitle').innerText = "Mahsulotni tahrirlash";
            document.getElementById('saveBtn').innerText = "Saqlash";
            document.getElementById('cancelBtn').classList.remove('hidden');
        }

        function resetForm() {
            document.getElementById('editIndex').value = "-1";
            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pImg').value = '';
            document.getElementById('pDiscount').checked = false;
            document.getElementById('formTitle').innerText = "Mahsulotni qo'shish yoki tahrirlash";
            document.getElementById('saveBtn').innerText = "Saqlash";
            document.getElementById('cancelBtn').classList.add('hidden');
        }

        function deleteProduct(id) {
            products = products.filter(p => p.id !== id);
            localStorage.setItem('zor_products', JSON.stringify(products));
            renderProducts();
        }

        function renderOrders() {
            const list = document.getElementById('orderList');
            list.innerHTML = '';
            if (orders.length === 0) {
                list.innerHTML = `<p class="text-center text-gray-400 py-6 text-xs">Hozircha buyurtmalar yo'q</p>`;
                return;
            }
            orders.forEach(o => {
                let itemsStr = o.items.map(i => `${i.name} (${i.qty} ta)`).join(', ');
                list.innerHTML += `
                    <div class="bg-gray-50 p-3.5 rounded-xl border text-xs space-y-1">
                        <p class="font-bold text-gray-800">Tel: ${o.phone} | Manzil: ${o.address}</p>
                        <p class="text-gray-600">Mahsulotlar: ${itemsStr}</p>
                        <div class="flex justify-between text-[11px] text-gray-500 pt-1 border-t">
                            <span class="font-black text-emerald-600">Jami: ${Number(o.total).toLocaleString()} so'm</span>
                            <span>${o.date}</span>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
