<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZO'R market - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <!-- Admin Login Screen -->
    <div id="authSection" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-xl shadow-md w-full max-w-md">
            <h2 class="text-xl font-bold mb-4 text-emerald-600"><i class="fa-solid fa-lock mr-2"></i> Admin Panel Kirish</h2>
            <div class="space-y-3">
                <input type="email" id="adminEmail" placeholder="Admin Email" class="w-full border p-2.5 rounded-lg text-sm">
                <input type="password" id="adminPassword" placeholder="Parol" class="w-full border p-2.5 rounded-lg text-sm">
                <button onclick="adminLogin()" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg font-medium hover:bg-emerald-700">Kirish</button>
                <a href="index.html" class="block text-center text-sm text-gray-500 hover:underline mt-2">← Asosiy saytga qaytish</a>
            </div>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard" class="hidden min-h-screen flex flex-col">
        <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-emerald-600"><i class="fa-solid fa-gauge mr-2"></i> ZO'R market - Admin Boshqaruv</h1>
            <div class="space-x-3">
                <a href="index.html" class="bg-gray-100 text-gray-700 px-3 py-2 rounded-lg text-sm font-medium">Saytga o'tish</a>
                <button onclick="adminLogout()" class="bg-red-50 text-red-600 px-3 py-2 rounded-lg text-sm font-medium">Chiqish</button>
            </div>
        </header>
        <main class="max-w-6xl mx-auto p-6 flex-1 w-full">
            <div class="flex space-x-2 mb-6 border-b pb-2">
                <button onclick="switchTab('products')" id="tabProd" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-medium">Mahsulotlar</button>
                <button onclick="switchTab('orders')" id="tabOrd" class="bg-gray-100 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium">Buyurtmalar</button>
            </div>

            <!-- Products Tab -->
            <div id="productsTab">
                <div class="bg-white p-4 rounded-xl shadow-sm mb-6">
                    <h3 class="font-bold mb-3">Yangi mahsulot qo'shish</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                        <input type="text" id="pName" placeholder="Nomi" class="border p-2 rounded text-sm">
                        <input type="number" id="pPrice" placeholder="Narxi (so'm)" class="border p-2 rounded text-sm">
                        <input type="text" id="pImg" placeholder="Rasm URL havolasi" class="border p-2 rounded text-sm">
                        <select id="pCat" class="border p-2 rounded text-sm">
                            <option value="fruits">Meva va sabzavotlar</option>
                            <option value="dairy">Sut mahsulotlari</option>
                            <option value="bakery">Non mahsulotlari</option>
                            <option value="sweets">Shirinliklar</option>
                        </select>
                    </div>
                    <button onclick="addProduct()" class="mt-3 bg-emerald-600 text-white px-4 py-2 rounded text-sm font-medium">Qo'shish</button>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm">
                    <h3 class="font-bold mb-3">Mavjud mahsulotlar</h3>
                    <div id="productList" class="space-y-2"></div>
                </div>
            </div>

            <!-- Orders Tab -->
            <div id="ordersTab" class="hidden">
                <div class="bg-white p-4 rounded-xl shadow-sm">
                    <h3 class="font-bold mb-3">Kelib tushgan buyurtmalar</h3>
                    <div id="orderList" class="space-y-3"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('zor_current_user'));
        let products = JSON.parse(localStorage.getItem('zor_products')) || [];
        let orders = JSON.parse(localStorage.getItem('zor_orders')) || [];

        window.onload = function() {
            if (currentUser && currentUser.isAdmin) {
                showDashboard();
            } else {
                showAuth();
            }
        }

        function adminLogin() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            let users = JSON.parse(localStorage.getItem('zor_users')) || [];
            let user = users.find(u => u.email === email && u.password === password);

            if (user && user.isAdmin) {
                currentUser = user;
                localStorage.setItem('zor_current_user', JSON.stringify(currentUser));
                showDashboard();
            } else {
                alert("Xato! Bu email admin emas yoki parol noto'g'ri.");
            }
        }

        function adminLogout() {
            currentUser = null;
            localStorage.removeItem('zor_current_user');
            showAuth();
        }

        function showAuth() {
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('adminDashboard').classList.add('hidden');
        }

        function showDashboard() {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('adminDashboard').classList.remove('hidden');
            renderProducts();
            renderOrders();
        }

        function switchTab(tab) {
            if (tab === 'products') {
                document.getElementById('productsTab').classList.remove('hidden');
                document.getElementById('ordersTab').classList.add('hidden');
                document.getElementById('tabProd').className = "bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-medium";
                document.getElementById('tabOrd').className = "bg-gray-100 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium";
            } else {
                document.getElementById('productsTab').classList.add('hidden');
                document.getElementById('ordersTab').classList.remove('hidden');
                document.getElementById('tabOrd').className = "bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-medium";
                document.getElementById('tabProd').className = "bg-gray-100 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium";
            }
        }

        function addProduct() {
            const name = document.getElementById('pName').value;
            const price = Number(document.getElementById('pPrice').value);
            const image = document.getElementById('pImg').value || "https://images.unsplash.com/photo-1542838132-92c53300491e?w=400";
            const category = document.getElementById('pCat').value;

            if (!name || !price) return alert("Nomi va narxini kiriting!");

            products.push({ id: Date.now(), name, price, category, image });
            localStorage.setItem('zor_products', JSON.stringify(products));
            renderProducts();
            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pImg').value = '';
            alert("Mahsulot qo'shildi!");
        }

        function renderProducts() {
            const list = document.getElementById('productList');
            list.innerHTML = '';
            products.forEach(p => {
                list.innerHTML += `
                    <div class="flex items-center justify-between bg-gray-50 p-2.5 rounded border text-sm">
                        <div class="flex items-center space-x-3">
                            <img src="${p.image}" class="w-10 h-10 object-cover rounded">
                            <div>
                                <p class="font-medium">${p.name}</p>
                                <p class="text-xs text-emerald-600 font-bold">${p.price.toLocaleString()} so'm</p>
                            </div>
                        </div>
                        <button onclick="deleteProduct(${p.id})" class="bg-red-50 text-red-600 px-3 py-1 rounded text-xs hover:bg-red-100">O'chirish</button>
                    </div>
                `;
            });
        }

        function deleteProduct(id) {
            products = products.filter(p => p.id !== id);
            localStorage.setItem('zor_products', JSON.stringify(products));
            renderProducts();
        }

        function renderOrders() {
            const list = document.getElementById('orderList');
            list.innerHTML = '';
            if (orders.length === 0) {
                list.innerHTML = `<p class="text-center text-gray-400 py-4">Hozircha buyurtmalar yo'q</p>`;
                return;
            }
            orders.forEach(o => {
                let itemsStr = o.items.map(i => `${i.name} (${i.qty} ta)`).join(', ');
                list.innerHTML += `
                    <div class="bg-gray-50 p-3 rounded border text-sm space-y-1">
                        <p class="font-bold">Tel: ${o.phone} | Manzil: ${o.address}</p>
                        <p class="text-gray-600">Mahsulotlar: ${itemsStr}</p>
                        <div class="flex justify-between text-xs text-gray-500 pt-1 border-t">
                            <span class="font-bold text-emerald-600 text-sm">Jami: ${o.total.toLocaleString()} so'm</span>
                            <span>${o.date}</span>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
